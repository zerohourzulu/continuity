name: Public verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: continuity-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.scope.outputs.level }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: scope
        run: python3 -B tools/site-check/classify.py
  website:
    name: Website checks
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/site-check/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B tools/site-check/test_classify.py
      - run: python3 -B tools/site-check/links.py
      - run: python3 -B tools/sync-public-docs.py --check
      - run: node tools/render-quickstart.mjs --check
      - if: github.event_name != 'pull_request'
        run: node tools/verify-package.mjs
      - run: npm ci --prefix tools/site-check --ignore-scripts --no-audit --no-fund
      - run: tools/site-check/node_modules/.bin/playwright install --with-deps chromium
      - run: node tools/site-check/browser.mjs
      - name: Playground engine parity and scenarios
        if: needs.changes.outputs.level != 'site'
        run: |
          node tools/build-playground.mjs --check
          node --test tests/browser/model.test.mjs tests/browser/vectors.test.mjs
  verify:
    needs: changes
    if: needs.changes.outputs.level == 'full'
    name: ${{ matrix.os }} / Node${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recorded reading without installed dependencies
        run: node examples/recorded.mjs
      - name: Setup documentation agrees
        run: node tools/render-quickstart.mjs --check
      - name: Locked dependencies, no global pnpm or install scripts
        run: node tools/setup.mjs
      - name: Verify released package identity
        if: github.event_name != 'pull_request'
        run: node tools/verify-package.mjs
      - name: Public regression and actual conformance controls
        run: node tools/test.mjs
      - name: Browser profile parity and scenario checks
        run: |
          node tools/build-playground.mjs --check
          node --test tests/browser/model.test.mjs tests/browser/vectors.test.mjs
      - name: Pinned SDK build tools (no install scripts)
        run: npm ci --prefix tools/sdk-build --ignore-scripts --no-audit --no-fund
      - name: Release tooling with separate Node and npm installations
        run: node --test tools/release/npm-path.test.mjs
      - name: Frozen 0.2 SDK compatibility and independent consumer
        run: |
          node tools/sdk-parity.mjs
          node tools/verify-sdk.mjs
      - name: Core 0.3 integrations and independent packages
        run: |
          npm ci --prefix integrations/protected-evidence-mcp --ignore-scripts --no-audit --no-fund
          npm ci --prefix integrations/langchain-evidence --ignore-scripts --no-audit --no-fund
          npm ci --prefix integrations/policy-composition --ignore-scripts --no-audit --no-fund
          npm ci --prefix examples/core-0.3/signing --ignore-scripts --no-audit --no-fund
          node tools/release/check-locks.mjs
          node tools/build-core-0.3.mjs --check
          node tools/verify-core-0.3.mjs
          node tools/verify-mcp-package.mjs
          node --test integrations/protected-evidence-mcp/tests/*.test.mjs integrations/langchain-evidence/tests/*.test.mjs integrations/policy-composition/tests/cedar.test.mjs integrations/policy-composition/tests/wire-policy.test.mjs
      - name: Shared Core and remote integration (supported Node versions)
        if: matrix.node != '26'
        run: |
          node tools/verify-shared-core.mjs
          node tools/remote-build/verify.mjs .
          node --test --test-concurrency=1 lab/*.test.mjs
      - name: MCP gateway (supported Node versions)
        if: matrix.node != '26'
        run: |
          npm ci --prefix packages/mcp-gateway --ignore-scripts --no-audit --no-fund
          node --test tools/client-setup/test.mjs
          npm test --prefix packages/mcp-gateway
          node tools/verify-gateway.mjs
      - name: Continued investigation through the exact installed tuple
        if: matrix.node != '26'
        run: node tools/release/verify.mjs
      - name: Fresh tutorial and changed permission
        run: |
          node tutorial/start.mjs
          node tutorial/start.mjs --deny-review --packet
      - name: Ensure checks did not change packaged files
        if: github.event_name != 'pull_request'
        run: node tools/verify-package.mjs

  result:
    name: Verification result
    if: always()
    needs: [changes, website, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected checks to pass
        env:
          LEVEL: ${{ needs.changes.outputs.level }}
          CHANGES: ${{ needs.changes.result }}
          WEBSITE: ${{ needs.website.result }}
          FULL: ${{ needs.verify.result }}
        run: |
          test "$CHANGES" = success
          test "$WEBSITE" = success
          case "$LEVEL" in
            full) test "$FULL" = success ;;
            site|playground) test "$FULL" = skipped ;;
            *) exit 1 ;;
          esac
